<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ethoria · Edit Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d14;--card:#13131e;--border:#1c1c2e;--purple:#7c3aed;--purple-light:#a855f7;--text:#e2e8f0;--muted:#64748b;--nav-h:60px;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(13,13,20,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-logo{font-size:1.3rem;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,var(--purple-light),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.back-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 14px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.85rem}
.content{max-width:500px;margin:0 auto;padding:calc(var(--nav-h) + 40px) 16px 40px}
h2{font-size:1.3rem;font-weight:700;margin-bottom:28px}
.avatar-section{display:flex;flex-direction:column;align-items:center;margin-bottom:32px}
.avatar-wrap{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;overflow:hidden;margin-bottom:12px;cursor:pointer;position:relative}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
.avatar-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;font-size:.75rem;color:#fff;border-radius:50%}
.avatar-wrap:hover .avatar-overlay{display:flex}
.change-photo-btn{background:none;border:none;color:var(--purple-light);cursor:pointer;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600}
.form-group{margin-bottom:20px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-weight:500}
input,textarea{width:100%;background:#0a0a12;border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--purple)}
textarea{resize:none;min-height:80px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:#0a0a12;border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.toggle-label{font-size:.9rem}
.toggle-sub{font-size:.75rem;color:var(--muted);margin-top:2px}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:24px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked + .toggle-slider{background:var(--purple)}
.toggle input:checked + .toggle-slider:before{transform:translateX(20px)}
.save-btn{width:100%;background:linear-gradient(135deg,var(--purple),var(--purple-light));border:none;border-radius:10px;color:#fff;padding:12px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;margin-top:8px;transition:opacity .2s}
.save-btn:hover{opacity:.9}
.save-btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}.toast.success{border-color:#22c55e;color:#22c55e}.toast.error{border-color:#ef4444;color:#ef4444}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="location.href='/home.html'">ETHORIA</div>
  <button class="back-btn" onclick="location.href='/profile.html?user='+currentUsername">← Back</button>
</nav>
<div class="content">
  <h2>Edit Profile</h2>

  <!-- AVATAR -->
  <div class="avatar-section">
    <div class="avatar-wrap" id="avatarWrap" onclick="document.getElementById('avatarInput').click()">
      <img id="avatarImg" src="" style="display:none"/>
      <span id="avatarLetter"></span>
      <div class="avatar-overlay">Change</div>
    </div>
    <button class="change-photo-btn" onclick="document.getElementById('avatarInput').click()">Change Profile Photo</button>
    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="previewAvatar()"/>
  </div>

  <!-- FORM -->
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="inputUsername" placeholder="Username"/>
  </div>
  <div class="form-group">
    <label>Bio</label>
    <textarea id="inputBio" placeholder="Write something about yourself..."></textarea>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="inputEmail" placeholder="Email"/>
  </div>

  <!-- PRIVATE/PUBLIC TOGGLE -->
  <div class="form-group">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Private Account</div>
        <div class="toggle-sub">Only followers can see your posts</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="privateToggle"/>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <button class="save-btn" id="saveBtn" onclick="saveProfile()">Save Changes</button>
</div>

<div class="toast" id="toast"></div>

<script>
let currentUsername = '';
let avatarB64 = '';

function getToken(){return localStorage.getItem('token');}
function authHeaders(){return {'Content-Type':'application/json','Authorization':`Bearer ${getToken()}`};}

async function loadMe(){
  if(!getToken()){location.href='/login.html';return;}
  const r = await fetch('/api/auth/me',{headers:authHeaders(),credentials:'include'});
  if(!r.ok){location.href='/login.html';return;}
  const user = await r.json();
  currentUsername = user.username;
  document.getElementById('inputUsername').value = user.username;
  document.getElementById('inputBio').value = user.bio || '';
  document.getElementById('inputEmail').value = user.email || '';
  document.getElementById('privateToggle').checked = user.is_private || false;
  document.getElementById('avatarLetter').textContent = user.username[0].toUpperCase();
  if(user.avatar){
    document.getElementById('avatarImg').src = user.avatar;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarLetter').style.display = 'none';
  }
}

function previewAvatar(){
  const file = document.getElementById('avatarInput').files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    avatarB64 = e.target.result;
    document.getElementById('avatarImg').src = e.target.result;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarLetter').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function saveProfile(){
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving...';
  const body = {
    username: document.getElementById('inputUsername').value.trim(),
    bio: document.getElementById('inputBio').value.trim(),
    email: document.getElementById('inputEmail').value.trim(),
    is_private: document.getElementById('privateToggle').checked,
    avatar_b64: avatarB64,
  };
  const r = await fetch('/api/auth/update-profile',{method:'PUT',headers:authHeaders(),credentials:'include',body:JSON.stringify(body)});
  const d = await r.json();
  btn.disabled = false;
  btn.innerHTML = 'Save Changes';
  if(!r.ok){showToast(d.error || 'Failed to save','error');return;}
  showToast('Profile updated!','success');
  currentUsername = body.username;
  setTimeout(() => location.href = `/profile.html?user=${body.username}`, 1500);
}

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>t.className='toast',2500);
}

loadMe();
</script>
</body>
</html>
