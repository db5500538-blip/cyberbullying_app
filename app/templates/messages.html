<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ethoria · Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d14;--card:#13131e;--border:#1c1c2e;--purple:#7c3aed;--purple-light:#a855f7;--text:#e2e8f0;--muted:#64748b;--nav-h:60px;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow:hidden}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(13,13,20,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.nav-logo{font-size:1.3rem;font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,var(--purple-light),#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.msg-layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - var(--nav-h));margin-top:var(--nav-h)}
/* LEFT - conversations */
.conv-panel{border-right:1px solid var(--border);display:flex;flex-direction:column}
.conv-header{padding:16px;border-bottom:1px solid var(--border)}
.conv-header h3{font-size:1rem;font-weight:600;margin-bottom:10px}
.conv-search{width:100%;background:#0a0a12;border:1px solid var(--border);border-radius:20px;padding:8px 14px;color:var(--text);font-family:'Outfit',sans-serif;font-size:.85rem;outline:none}
.conv-search:focus{border-color:var(--purple)}
.conv-list{flex:1;overflow-y:auto}
.conv-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .2s}
.conv-item:hover,.conv-item.active{background:rgba(124,58,237,.08)}
.conv-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#1d4ed8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;color:#fff;flex-shrink:0}
.conv-info{flex:1;min-width:0}
.conv-name{font-size:.9rem;font-weight:600}
.conv-preview{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-time{font-size:.72rem;color:var(--muted);flex-shrink:0}
.unread-dot{width:8px;height:8px;background:var(--purple-light);border-radius:50%;flex-shrink:0}
/* RIGHT - chat */
.chat-panel{display:flex;flex-direction:column}
.chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#1d4ed8);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:.9rem}
.chat-name{font-size:.95rem;font-weight:600}
.chat-status{font-size:.75rem;color:var(--muted)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg-bubble{max-width:65%;padding:10px 14px;border-radius:16px;font-size:.88rem;line-height:1.5;position:relative}
.msg-bubble.sent{background:linear-gradient(135deg,var(--purple),var(--purple-light));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg-bubble.recv{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg-time{font-size:.68rem;opacity:.6;margin-top:4px;text-align:right}
.chat-input-row{padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-input{flex:1;background:#0a0a12;border:1px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-family:'Outfit',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s}
.chat-input:focus{border-color:var(--purple)}
.send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple-light));border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .2s}
.send-btn:hover{opacity:.9}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted)}
.empty-chat svg{opacity:.3}
@media(max-width:700px){
  .msg-layout{grid-template-columns:1fr}
  .conv-panel{display:none}
  .conv-panel.mobile-show{display:flex}
}
</style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="location.href='/home.html'">ETHORIA</div>
  <span style="font-size:.9rem;font-weight:600">Messages</span>
  <button style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 14px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.85rem" onclick="location.href='/home.html'">← Home</button>
</nav>

<div class="msg-layout">
  <!-- LEFT PANEL -->
  <div class="conv-panel">
    <div class="conv-header">
      <h3>Messages</h3>
      <input class="conv-search" placeholder="Search conversations..." oninput="filterConvs(this.value)"/>
    </div>
    <div class="conv-list" id="convList">
      <div style="padding:30px;text-align:center;color:var(--muted);font-size:.85rem">Loading...</div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="chat-panel" id="chatPanel">
    <div class="empty-chat" id="emptyChat">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p>Select a conversation to start messaging</p>
    </div>
    <div id="activeChatHeader" style="display:none" class="chat-header">
      <div class="chat-avatar" id="chatAvatar"></div>
      <div>
        <div class="chat-name" id="chatName"></div>
        <div class="chat-status">Active now</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages" style="display:none"></div>
    <div class="chat-input-row" id="chatInputRow" style="display:none">
      <input class="chat-input" id="chatInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button class="send-btn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let activeConv = null;
let allConvs = [];
let pollTimer = null;

function getToken(){return localStorage.getItem('token');}
function authHeaders(){return {'Content-Type':'application/json','Authorization':`Bearer ${getToken()}`};}

async function init(){
  if(!getToken()){location.href='/login.html';return;}
  const r = await fetch('/api/auth/me',{headers:authHeaders(),credentials:'include'});
  if(!r.ok){location.href='/login.html';return;}
  currentUser = await r.json();
  loadConversations();
}

async function loadConversations(){
  const r = await fetch('/api/messages/conversations',{headers:authHeaders(),credentials:'include'});
  if(!r.ok) return;
  allConvs = await r.json();
  renderConvList(allConvs);
}

function renderConvList(convs){
  const el = document.getElementById('convList');
  if(!convs.length){
    el.innerHTML='<div style="padding:30px;text-align:center;color:var(--muted);font-size:.85rem">No conversations yet.<br/>Follow someone and message them!</div>';
    return;
  }
  el.innerHTML = convs.map(c => `
    <div class="conv-item ${activeConv===c.user_id?'active':''}" onclick="openChat('${c.user_id}','${c.username}')">
      <div class="conv-avatar">${c.username[0].toUpperCase()}</div>
      <div class="conv-info">
        <div class="conv-name">${c.username}</div>
        <div class="conv-preview">${c.last_message || 'Start a conversation'}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="conv-time">${c.last_time || ''}</span>
        ${c.unread ? '<div class="unread-dot"></div>' : ''}
      </div>
    </div>`).join('');
}

function filterConvs(q){
  const filtered = allConvs.filter(c => c.username.toLowerCase().includes(q.toLowerCase()));
  renderConvList(filtered);
}

async function openChat(userId, username){
  activeConv = userId;
  document.getElementById('emptyChat').style.display = 'none';
  document.getElementById('activeChatHeader').style.display = 'flex';
  document.getElementById('chatMessages').style.display = 'flex';
  document.getElementById('chatInputRow').style.display = 'flex';
  document.getElementById('chatAvatar').textContent = username[0].toUpperCase();
  document.getElementById('chatName').textContent = username;
  loadConvList_highlight();
  await loadMessages(userId);
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => loadMessages(userId), 3000);
}

function loadConvList_highlight(){
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
}

async function loadMessages(userId){
  const r = await fetch(`/api/messages/${userId}`,{headers:authHeaders(),credentials:'include'});
  if(!r.ok) return;
  const msgs = await r.json();
  const el = document.getElementById('chatMessages');
  el.innerHTML = msgs.map(m => `
    <div class="msg-bubble ${m.sender_id === currentUser._id ? 'sent' : 'recv'}">
      ${m.text}
      <div class="msg-time">${m.time}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !activeConv) return;
  input.value = '';
  await fetch(`/api/messages/${activeConv}`,{method:'POST',headers:authHeaders(),credentials:'include',body:JSON.stringify({text})});
  await loadMessages(activeConv);
  loadConversations();
}

init();
</script>
</body>
</html>
